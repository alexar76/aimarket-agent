name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install (dev)
        run: pip install -e ".[dev]"

      - name: Pytest + coverage badge
        run: bash scripts/ci_coverage_badge.sh -- tests/ -q --tb=short --maxfail=5 --cov=aimarket_agent

      - name: Assert package version
        run: python3 -c "import importlib.metadata as m; assert m.version('aimarket-agent')=='2.1.1'"
