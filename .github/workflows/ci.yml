name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install aimarket-hub (its Signer backs the real-signature tests)
        # Without it every cryptographic test skips and test_canonical_versions fails on purpose.
        run: |
          git clone --no-checkout https://github.com/alexar76/aimarket-hub.git _deps/aimarket-hub
          git -C _deps/aimarket-hub checkout 0d03800fae920d1de44dee9c6e6e589b6274c631  # alexar76/aimarket-hub main, 2026-10-21
          pip install -e _deps/aimarket-hub

      - name: Install (dev)
        run: pip install -e ".[dev]"

      - name: Pytest + coverage badge
        run: bash scripts/ci_coverage_badge.sh -- tests/ -q --tb=short --maxfail=5 --cov=aimarket_agent

      - name: Assert package version matches pyproject
        run: python3 -c "import importlib.metadata as m, tomllib; v=tomllib.load(open('pyproject.toml','rb'))['project']['version']; assert m.version('aimarket-agent')==v, (m.version('aimarket-agent'), v)"
